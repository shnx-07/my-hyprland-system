# =============================================================================
#  KITTY TERMINAL — ACTIVE CONFIGURATION
#  Clean extract of all active (uncommented) settings from kitty.conf
# =============================================================================


# =============================================================================
# FONTS
# =============================================================================

font_family      JetBrains Mono
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic

font_size 12.0

# Nerd Fonts v3.2.0 — symbol map
symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b1,U+e700-U+e7c5,U+ed00-U+efc1,U+f000-U+f2ff,U+f000-U+f2e0,U+f300-U+f372,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono

disable_ligatures never
undercurl_style   thin-sparse


# =============================================================================
# CURSOR
# =============================================================================

cursor_shape              block
cursor_blink_interval     0.8 linear
cursor_trail              10
cursor_trail_decay        0.1 0.3
cursor_trail_start_threshold 0
shell_integration         no-cursor


# =============================================================================
# TERMINAL BELL
# =============================================================================

enable_audio_bell no


# =============================================================================
# WINDOW LAYOUT
# =============================================================================

window_padding_width  3
hide_window_decorations yes
placement_strategy    center


# =============================================================================
# TAB BAR
# =============================================================================

tab_bar_edge          top
tab_bar_margin_width  0.0
tab_bar_margin_height 0.0 0.0
tab_bar_style         powerline
tab_bar_align         left
tab_bar_min_tabs      1
tab_switch_strategy   previous
tab_powerline_style   slanted
tab_title_max_length  0
tab_title_template    "{index}: {title}"


# =============================================================================
# COLOR SCHEME — BACKGROUND & OPACITY
# =============================================================================

background_opacity    0.85
background_image      /home/shnx/Wallpapers/Kitty/3.png
background_image_layout scaled
background_tint       0.75


# =============================================================================
# COLOR SCHEME — CATPPUCCIN MACCHIATO
# (https://github.com/catppuccin/kitty/blob/main/themes/macchiato.conf)
# =============================================================================

# Base colors
foreground           #cad3f5
background           #24273a
selection_foreground #24273a
selection_background #f4dbd6

# Cursor
cursor               #f4dbd6
cursor_text_color    #24273a

# URL underline
url_color            #f4dbd6
url_style            curly

# Window borders
active_border_color   #b7bdf8
inactive_border_color #6e738d
bell_border_color     #eed49f

# OS titlebar
wayland_titlebar_color system
macos_titlebar_color   system

# Tab bar
active_tab_foreground   #181926
active_tab_background   #c6a0f6
inactive_tab_foreground #cad3f5
inactive_tab_background #1e2030
tab_bar_background      #181926

# Marks
mark1_foreground #24273a
mark1_background #b7bdf8
mark2_foreground #24273a
mark2_background #c6a0f6
mark3_foreground #24273a
mark3_background #7dc4e4

# 16 terminal colors
color0  #494d64    # black (normal)
color8  #5b6078    # black (bright)
color1  #ed8796    # red (normal)
color9  #ed8796    # red (bright)
color2  #a6da95    # green (normal)
color10 #a6da95    # green (bright)
color3  #eed49f    # yellow (normal)
color11 #eed49f    # yellow (bright)
color4  #8aadf4    # blue (normal)
color12 #8aadf4    # blue (bright)
color5  #f5bde6    # magenta (normal)
color13 #f5bde6    # magenta (bright)
color6  #8bd5ca    # cyan (normal)
color14 #8bd5ca    # cyan (bright)
color7  #b8c0e0    # white (normal)
color15 #a5adcb    # white (bright)


# =============================================================================
# ADVANCED / SHELL
# =============================================================================

shell              /bin/zsh
editor             hx
scrollback_lines   10000

open_url_with  default
detect_urls    yes

startup_session session.conf


# =============================================================================
# KEYBOARD SHORTCUTS
# =============================================================================

# --- Search (kitten) ---
map kitty_mod+/  launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# --- Windows ---
map ctrl+shift+enter  new_window_with_cwd

# --- Tabs ---
map ctrl+shift+t      new_tab_with_cwd
map ctrl+shift+right  next_tab          # mirrors ctrl+right (window nav)
map ctrl+shift+left   previous_tab      # mirrors ctrl+left  (window nav)
map ctrl+shift+w      close_tab         # hyprland uses super+q, no conflict

# --- Window Navigation ---
map ctrl+left   neighbor_window left
map ctrl+right  neighbor_window right
map ctrl+up     neighbor_window up
map ctrl+down   neighbor_window down

# --- Multiple Cursor (send escape sequences) ---
map shift+alt+up   send_text all \x1b[1;4A
map shift+alt+down send_text all \x1b[1;4b

