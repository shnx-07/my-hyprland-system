general {
    hide_cursor = true
    grace = 2
    disable_loading_bar = true
}

background {
    monitor =
    path = screenshot

    blur_passes = 4
    blur_size = 8
    noise = 0.015
    contrast = 1.15
    brightness = 0.75
    vibrancy = 0.20
    vibrancy_darkness = 0.0
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(ffffffff)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B %Y')"
    color = rgba(ccffffff)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor =

    size = 320, 56
    position = 0, -90

    outer_color = rgba(7aa2f7ff)
    inner_color = rgba(1e1e2ecc)
    font_color = rgba(ffffffff)

    outline_thickness = 2
    rounding = 12

    dots_size = 0.28
    dots_spacing = 0.35
    dots_center = true

    fade_on_empty = false

    placeholder_text = Password
    fail_text = Authentication failed
    check_color = rgba(9ece6aff)
    fail_color = rgba(f7768eff)

    font_family = JetBrainsMono Nerd Font
}
